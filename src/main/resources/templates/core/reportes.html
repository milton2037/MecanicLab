<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

	<aside th:replace="~{fragments :: sidebar-interno('core', 'reportes')}"></aside>
	<main class="content">

			<div>
				<h1>Reportes y analítica</h1>
				<p>Indicadores por negocio. Solo se muestran negocios activos.</p>
			</div>
		</div>

			<article class="metric"><span>CDA · inspecciones hoy</span><strong>27</strong></article>

		<p class="note left">Si un negocio se desactiva, su bloque de indicadores desaparece de este tablero.</p>
	</main>
</div>

</html>
